<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Security Login</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f172a;
      }

      .login-container {
        width: 380px;
        padding: 35px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .login-container h1 {
        text-align: center;
        color: white;
        margin-bottom: 10px;
      }

      .login-container p {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        color: #cbd5e1;
        margin-bottom: 8px;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #475569;
        border-radius: 6px;
        background: #0f172a;
        color: white;
        outline: none;
      }

      .form-group input:focus {
        border-color: #60a5fa;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      #message {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
      }

      .security-info {
        margin-top: 25px;
        padding: 12px;
        border-radius: 6px;
        background: #0f172a;
        color: #94a3b8;
        text-align: center;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h1>🔐 Secure Login</h1>

      <p>Cybersecurity Threat Detection Platform</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>

          <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          />
        </div>

        <button type="submit">Login</button>
      </form>

      <div id="message"></div>

      <div class="security-info">
        Login attempts are monitored for suspicious activity.
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const username = document.getElementById("username").value;

          const password = document.getElementById("password").value;

          const message = document.getElementById("message");

          try {
            const response = await fetch("/login", {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                username: username,
                password: password,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              message.textContent = "Login successful!";

              message.style.color = "#4ade80";

              setTimeout(function () {
                window.location.href = "/";
              }, 1000);
            } else {
              message.textContent = data.error || "Login failed";

              message.style.color = "#f87171";
            }
          } catch (error) {
            console.error(error);

            message.textContent = "Unable to connect to server.";

            message.style.color = "#f87171";
          }
        });
    </script>
  </body>
</html>
